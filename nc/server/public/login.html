<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accedi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px -20px rgba(21, 32, 54, 0.25);
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 22px; color: #1B2740; }
  p.subtitle { margin: 0 0 28px; color: #616B7D; font-size: 14px; }
  input {
    width: 100%;
    padding: 14px;
    border: 1px solid #E4E4DE;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: #1B2740; }
  button {
    width: 100%;
    padding: 13px;
    background: #1B2740;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #E32726; font-size: 13px; margin: -8px 0 16px; min-height: 16px; }
  .success { color: #3AA845; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Area riservata</h1>
    <p class="subtitle">Inserisci la password di accesso</p>

    <input type="password" id="password" placeholder="Password" autocomplete="off" required />

    <div class="error" id="errorMsg"></div>

    <button type="submit" id="submitBtn">Accedi</button>
    <div class="success" id="successMsg" style="display: none;"></div>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      successMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Verifica in corso...";

      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || "Errore durante l'accesso.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Accedi";
          return;
        }

        localStorage.setItem("userToken", data.token);
        successMsg.textContent = "Accesso effettuato!";
        successMsg.style.display = "block";
        submitBtn.textContent = "Accesso effettuato";
      } catch (err) {
        errorMsg.textContent = "Impossibile contattare il server.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Accedi";
      }
    });
  </script>
</body>
</html>
