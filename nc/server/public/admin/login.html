<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px -20px rgba(21, 32, 54, 0.25);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    color: #1B2740;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: #616B7D;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #616B7D;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #E4E4DE;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus {
    border-color: #1B2740;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #1B2740;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: #E32726;
    font-size: 13px;
    margin: -8px 0 16px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Pannello Admin</h1>
    <p class="subtitle">Accedi per gestire i codici di accesso</p>

    <label for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username" required />

    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" autocomplete="current-password" required />

    <div class="error" id="errorMsg"></div>

    <button type="submit" id="submitBtn">Accedi</button>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    // Se è già presente un token valido, salta direttamente alla dashboard
    if (localStorage.getItem("adminToken")) {
      window.location.href = "/admin/dashboard.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Accesso in corso...";

      const user = document.getElementById("user").value.trim();
      const pass = document.getElementById("pass").value;

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, pass }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || "Errore durante il login.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Accedi";
          return;
        }

        localStorage.setItem("adminToken", data.token);
        window.location.href = "/admin/dashboard.html";
      } catch (err) {
        errorMsg.textContent = "Impossibile contattare il server.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Accedi";
      }
    });
  </script>
</body>
</html>
