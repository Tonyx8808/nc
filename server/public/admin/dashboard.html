<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FAFAF8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1B2740;
  }
  header {
    background: #1B2740;
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,0.1); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .panel {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #E4E4DE;
    padding: 24px;
    margin-bottom: 28px;
  }
  .panel h2 {
    margin: 0 0 4px;
    font-size: 16px;
  }
  .panel p.hint {
    margin: 0 0 18px;
    font-size: 13px;
    color: #616B7D;
  }

  .generate-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .generate-row button {
    background: #1B2740;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .generate-row button:hover { opacity: 0.9; }
  .generate-row button:disabled { opacity: 0.6; cursor: not-allowed; }

  .new-code-box {
    font-family: monospace;
    font-size: 20px;
    letter-spacing: 0.1em;
    background: #FAFAF8;
    border: 1px dashed #29A9E1;
    color: #1B2740;
    padding: 10px 16px;
    border-radius: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #E4E4DE;
  }
  th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #616B7D;
  }
  td.code-cell {
    font-family: monospace;
    font-weight: 600;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge.used { background: rgba(227,39,38,0.1); color: #E32726; }
  .badge.unused { background: rgba(58,168,69,0.1); color: #3AA845; }

  .empty {
    color: #616B7D;
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }
  .error {
    color: #E32726;
    font-size: 13px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>Pannello Admin — Gestione Codici</h1>
    <button id="logoutBtn">Esci</button>
  </header>

  <main>
    <section class="panel">
      <h2>Genera un nuovo codice</h2>
      <p class="hint">Crea un codice hex casuale di 8 caratteri, monouso.</p>
      <div class="generate-row">
        <button id="generateBtn">+ Genera codice</button>
        <span class="new-code-box" id="newCodeBox" style="display: none;"></span>
      </div>
      <div class="error" id="generateError"></div>
    </section>

    <section class="panel">
      <h2>Elenco codici</h2>
      <p class="hint">Tutti i codici generati, dal più recente.</p>
      <div id="tableWrapper">
        <table>
          <thead>
            <tr>
              <th>Codice</th>
              <th>Stato</th>
              <th>Creato il</th>
            </tr>
          </thead>
          <tbody id="codesTableBody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display: none;">Nessun codice generato finora.</div>
      </div>
      <div class="error" id="listError"></div>
    </section>
  </main>

  <script>
    const token = localStorage.getItem("adminToken");
    if (!token) {
      window.location.href = "/admin/login.html";
    }

    const authHeaders = {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token,
    };

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("adminToken");
      window.location.href = "/admin/login.html";
    });

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString("it-IT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    async function loadCodes() {
      const listError = document.getElementById("listError");
      const tbody = document.getElementById("codesTableBody");
      const emptyMsg = document.getElementById("emptyMsg");
      listError.textContent = "";

      try {
        const res = await fetch("/api/admin/list-codes", { headers: authHeaders });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("adminToken");
          window.location.href = "/admin/login.html";
          return;
        }

        const codes = await res.json();

        if (!res.ok) {
          listError.textContent = codes.error || "Errore nel caricamento dei codici.";
          return;
        }

        tbody.innerHTML = "";

        if (codes.length === 0) {
          emptyMsg.style.display = "block";
          return;
        }

        emptyMsg.style.display = "none";

        codes.forEach((c) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="code-cell">${c.code}</td>
            <td>
              <span class="badge ${c.used ? "used" : "unused"}">
                ${c.used ? "Usato" : "Disponibile"}
              </span>
            </td>
            <td>${formatDate(c.createdAt)}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        listError.textContent = "Impossibile contattare il server.";
      }
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const btn = document.getElementById("generateBtn");
      const newCodeBox = document.getElementById("newCodeBox");
      const generateError = document.getElementById("generateError");

      btn.disabled = true;
      btn.textContent = "Generazione...";
      generateError.textContent = "";

      try {
        const res = await fetch("/api/admin/generate-code", {
          method: "POST",
          headers: authHeaders,
        });

        const data = await res.json();

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("adminToken");
          window.location.href = "/admin/login.html";
          return;
        }

        if (!res.ok) {
          generateError.textContent = data.error || "Errore nella generazione del codice.";
          return;
        }

        newCodeBox.textContent = data.code;
        newCodeBox.style.display = "inline-flex";

        loadCodes();
      } catch (err) {
        generateError.textContent = "Impossibile contattare il server.";
      } finally {
        btn.disabled = false;
        btn.textContent = "+ Genera codice";
      }
    });

    loadCodes();
  </script>
</body>
</html>
